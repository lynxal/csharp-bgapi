name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Compute version
        id: version
        run: |
          if DESC=$(git describe --tags --match "v*" HEAD 2>/dev/null); then
            if [[ "$DESC" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              VERSION="${BASH_REMATCH[1]}"
            elif [[ "$DESC" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-([0-9]+)-g ]]; then
              TAG="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
              NEXT_PATCH="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
              # A prerelease of X.Y.Z sorts below X.Y.Z, so a build past vX.Y.Z must not reuse X.Y.Z
              # as its base: it used to publish X.Y.Z-ci.N, which looks older than the X.Y.Z release
              # it follows. The base is the csproj's AssemblyVersion when it is already past the tag
              # (the next planned release), else the next patch.
              ASSEMBLY=$(grep -oP '(?<=<AssemblyVersion>)[^<]+' src/CsharpBgapi/CsharpBgapi.csproj)
              if [[ "$ASSEMBLY" != "$TAG" && "$(printf '%s\n' "$TAG" "$ASSEMBLY" | sort -V | tail -n 1)" == "$ASSEMBLY" ]]; then
                BASE="$ASSEMBLY"
              else
                BASE="$NEXT_PATCH"
              fi
              # N is the total commit count, as before any tag existed, not the height from the tag.
              # The height restarts at every new tag, so while the base is AssemblyVersion a tag
              # landing on main (a hotfix, or the first tag after builds already published by count)
              # put later builds below earlier ones, or repeated a version --skip-duplicate then dropped.
              VERSION="${BASE}-ci.$(git rev-list --count HEAD)"
            else
              echo "::error::Unexpected git describe output: $DESC"
              exit 1
            fi
          else
            BASE=$(grep -oP '(?<=<AssemblyVersion>)[^<]+' src/CsharpBgapi/CsharpBgapi.csproj)
            COUNT=$(git rev-list --count HEAD)
            VERSION="${BASE}-ci.${COUNT}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release /p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: "**/TestResults/**/coverage.cobertura.xml"
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Pack
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet pack src/CsharpBgapi/CsharpBgapi.csproj --no-build --configuration Release --output ./artifacts /p:Version=${{ steps.version.outputs.version }}

      - name: Validate package consumers
        run: python3 scripts/package-smoke.py --version '${{ steps.version.outputs.version }}' --sdk "$(dotnet --version)" --skip-build

      - name: Upload package validation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-validation
          path: |
            artifacts/validation/packages/manifest.json
            artifacts/validation/packages/command-*.log

      - name: Upload package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
